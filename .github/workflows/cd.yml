name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: video-api
            dockerfile: apps/video-api/Dockerfile
          - app: video-processor
            dockerfile: apps/video-processor/Dockerfile
          - app: notification
            dockerfile: apps/notification-service/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fiapx-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fiapx-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy smoke test (kind)
    runs-on: ubuntu-latest
    needs: [publish]
    # We don't operate a real cluster, so this doesn't ship anywhere. It spins
    # up an ephemeral kind cluster, deploys throwaway stand-ins for Postgres/
    # Redis/RabbitMQ/MinIO/MailHog (infra/k8s/kind/dependencies.yaml), and
    # applies the real infra/k8s manifests pinned to this build's images. That
    # proves the manifests apply, migrations run, and every rollout reaches
    # Ready — catching the kind of breakage a real deploy would hit, without
    # needing production credentials.
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: fiapx-cd
          wait: 60s

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load this build's images into kind
        run: |
          for app in video-api video-processor notification web; do
            image="ghcr.io/${{ github.repository_owner }}/fiapx-$app:${{ github.sha }}"
            docker pull "$image"
            kind load docker-image "$image" --name fiapx-cd
          done

      - name: Load backing-service images into kind
        # Pulled once on the runner's own Docker daemon and side-loaded,
        # instead of letting containerd inside the kind node pull them live.
        # These are official multi-arch Docker Hub images, and the runner's
        # containerd-backed Docker only materializes the host platform's
        # layers on pull — but `kind load docker-image` always imports
        # --all-platforms, so it goes looking for arch layers that were
        # never fetched and fails. Saving/loading a single-platform archive
        # sidesteps that: https://kind.sigs.k8s.io/docs/user/known-issues/
        run: |
          images=(
            postgres:17-alpine
            redis:7-alpine
            rabbitmq:3.13-management-alpine
            quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
            quay.io/minio/mc:RELEASE.2024-11-05T11-29-45Z
            mailhog/mailhog:v1.0.1
          )
          for image in "${images[@]}"; do
            # --platform on the pull collapses the manifest list to a single
            # concrete image locally, so save doesn't need --platform (and
            # shouldn't: passing it there triggers a fresh registry manifest
            # lookup, which is what was failing as "unauthorized").
            docker pull --platform linux/amd64 "$image"
            tar_file="$RUNNER_TEMP/$(echo "$image" | tr '/:' '__').tar"
            docker image save -o "$tar_file" "$image"
            kind load image-archive "$tar_file" --name fiapx-cd
            rm -f "$tar_file"
          done

      - name: Deploy backing services
        run: kubectl apply -f infra/k8s/kind/dependencies.yaml

      - name: Wait for backing services
        run: kubectl -n fiapx wait --for=condition=available deployment -l tier=dependency --timeout=180s

      - name: Apply application manifests pinned to this build
        run: |
          # kustomize refuses absolute/outside-root resource paths, so the
          # overlay has to live inside the checkout, as a sibling of infra/
          # (not nested under infra/k8s itself, which kustomize treats as a
          # cycle when the overlay resource points back at its own ancestor).
          overlay="$GITHUB_WORKSPACE/.kind-overlay"
          mkdir -p "$overlay"
          cat > "$overlay/kustomization.yaml" <<EOF
          resources:
            - ../infra/k8s
          images:
            - name: ghcr.io/${{ github.repository_owner }}/fiapx-video-api
              newTag: '${{ github.sha }}'
            - name: ghcr.io/${{ github.repository_owner }}/fiapx-video-processor
              newTag: '${{ github.sha }}'
            - name: ghcr.io/${{ github.repository_owner }}/fiapx-notification
              newTag: '${{ github.sha }}'
            - name: ghcr.io/${{ github.repository_owner }}/fiapx-web
              newTag: '${{ github.sha }}'
          EOF
          kubectl apply -k "$overlay"

      - name: Run migrations
        run: kubectl -n fiapx wait --for=condition=complete job/video-api-migrate --timeout=180s

      - name: Roll out services
        run: |
          for deployment in video-api video-processor notification web; do
            kubectl -n fiapx rollout status "deployment/$deployment" --timeout=180s
          done

      - name: Dump cluster state
        if: failure()
        run: |
          kubectl -n fiapx get all
          kubectl -n fiapx get events --sort-by=.lastTimestamp
          for pod in $(kubectl -n fiapx get pods -o name); do
            echo "::group::describe $pod"
            kubectl -n fiapx describe "$pod"
            echo "::endgroup::"
            echo "::group::logs $pod"
            kubectl -n fiapx logs "$pod" --all-containers --prefix --tail=200 || true
            echo "::endgroup::"
          done
