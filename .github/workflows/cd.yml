name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: video-api
            dockerfile: apps/video-api/Dockerfile
          - app: video-processor
            dockerfile: apps/video-processor/Dockerfile
          - app: notification
            dockerfile: apps/notification-service/Dockerfile
          - app: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fiapx-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fiapx-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: deploy to kubernetes
    runs-on: ubuntu-latest
    needs: [publish]
    environment: production
    # Requires a KUBE_CONFIG secret. Without a cluster configured the job is a
    # no-op instead of a red build.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply manifests
        run: kubectl apply -k infra/k8s

      - name: Run migrations
        run: |
          kubectl -n fiapx delete job video-api-migrate --ignore-not-found
          kubectl apply -f infra/k8s/video-api.yaml
          kubectl -n fiapx wait --for=condition=complete job/video-api-migrate --timeout=300s

      - name: Roll out services
        run: |
          for deployment in video-api video-processor notification web; do
            kubectl -n fiapx set image "deployment/$deployment" \
              "$deployment=ghcr.io/${{ github.repository_owner }}/fiapx-$deployment:${{ github.sha }}" \
              || true
            kubectl -n fiapx rollout status "deployment/$deployment" --timeout=300s
          done
