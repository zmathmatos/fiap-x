name: fiapx

x-storage-env: &storage-env
  STORAGE_ENDPOINT: http://s3mock:9090
  STORAGE_REGION: us-east-1
  STORAGE_ACCESS_KEY: fiapx
  STORAGE_SECRET_KEY: fiapx-secret
  STORAGE_BUCKET_RAW: fiapx-raw
  STORAGE_BUCKET_ZIPS: fiapx-zips
  STORAGE_FORCE_PATH_STYLE: 'true'

x-broker-env: &broker-env
  RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
  RABBITMQ_EXCHANGE: video-events
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fiapx
      POSTGRES_USER: fiapx
      POSTGRES_PASSWORD: fiapx
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fiapx -d fiapx']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fiapx
      RABBITMQ_DEFAULT_PASS: fiapx
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672' # painel: fiapx / fiapx
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 10s
      retries: 12

  # S3-compatible test double. MinIO's Docker Hub / quay.io images now require
  # an authenticated pull (all tags, including :latest), which broke `make up`
  # and CI outright. S3Mock stays freely pullable and creates both buckets on
  # boot, so there is no separate init container needed.
  s3mock:
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: fiapx-raw,fiapx-zips
    volumes:
      - s3mock-data:/s3mockroot
    ports:
      - '9000:9090' # host 9090 is taken by prometheus

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '1025:1025'
      - '8025:8025' # caixa de entrada
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    build:
      context: ..
      dockerfile: apps/video-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: fiapx
      DB_USER: fiapx
      DB_PASSWORD: fiapx
      DB_SCHEMA: video
      JWT_SECRET: local-dev-secret-change-me
      <<: *storage-env
    # Roda as migrações a partir do build compilado e sai.
    command:
      [
        'node',
        '-e',
        "const{createDataSource}=require('/app/apps/video-api/dist/infrastructure/database/data-source');const{loadConfig}=require('/app/apps/video-api/dist/config');const ds=createDataSource(loadConfig().database);ds.initialize().then(()=>ds.runMigrations()).then(m=>{console.log('migrations aplicadas:',m.length);return ds.destroy()}).then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})",
      ]
    restart: 'no'

  video-api:
    build:
      context: ..
      dockerfile: apps/video-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      s3mock:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      API_PORT: '3000'
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRES_IN: 8h
      MAX_UPLOAD_BYTES: '524288000'
      FRAME_INTERVAL_SECONDS: '20'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: fiapx
      DB_USER: fiapx
      DB_PASSWORD: fiapx
      DB_SCHEMA: video
      <<: [*broker-env, *storage-env]
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  video-processor:
    build:
      context: ..
      dockerfile: apps/video-processor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3mock:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PROCESSOR_PREFETCH: '1'
      PROCESSOR_HEALTH_PORT: '9100'
      <<: [*broker-env, *storage-env]
    # Duas réplicas por padrão; `make scale` sobe para quatro na demonstração.
    deploy:
      replicas: 2
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 6

  notification:
    build:
      context: ..
      dockerfile: apps/notification-service/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      NOTIFICATION_HEALTH_PORT: '9101'
      APP_PUBLIC_URL: http://localhost:8080
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: FIAP X <no-reply@fiapx.local>
      <<: *broker-env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:9101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      video-api:
        condition: service_healthy
    ports:
      - '8080:8080'

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3001:3000'

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  s3mock-data:
  prometheus-data:
  grafana-data:
