# Backing services for the CD kind smoke test only. Not part of the production
# kustomization (infra/k8s/kustomization.yaml) — real environments point at
# managed Postgres/Redis/RabbitMQ/S3/SMTP instead.
#
# Nothing here carries a credential: the workflow generates them and creates the
# `fiapx-secrets` Secret before applying this file, and every service below reads
# its own from there. The cluster is destroyed within the same CI job.
apiVersion: v1
kind: Namespace
metadata:
  name: fiapx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fiapx
  labels: { app: postgres, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: fiapx }
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: DB_PASSWORD }
          ports:
            - { name: db, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ['sh', '-c', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fiapx
spec:
  selector: { app: postgres }
  ports:
    - { name: db, port: 5432, targetPort: db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fiapx
  labels: { app: redis, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { name: db, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fiapx
spec:
  selector: { app: redis }
  ports:
    - { name: db, port: 6379, targetPort: db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fiapx
  labels: { app: rabbitmq, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: fiapx-secrets, key: RABBITMQ_PASSWORD }
          ports:
            - { name: amqp, containerPort: 5672 }
          readinessProbe:
            exec:
              command: ['rabbitmq-diagnostics', '-q', 'check_running']
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fiapx
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3mock
  namespace: fiapx
  labels: { app: s3mock, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: s3mock }
  template:
    metadata:
      labels: { app: s3mock }
    spec:
      containers:
        - name: s3mock
          image: adobe/s3mock:5.2.3
          env:
            - { name: COM_ADOBE_TESTING_S3MOCK_STORE_ROOT, value: /s3mockroot }
            - { name: COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS, value: fiapx-raw,fiapx-zips }
          ports:
            - { name: api, containerPort: 9090 }
          readinessProbe:
            tcpSocket: { port: api }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: s3mock
  namespace: fiapx
spec:
  selector: { app: s3mock }
  ports:
    - { name: api, port: 9000, targetPort: api }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: fiapx
  labels: { app: mailhog, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailhog }
  template:
    metadata:
      labels: { app: mailhog }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - { name: smtp, containerPort: 1025 }
          readinessProbe:
            tcpSocket: { port: smtp }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: fiapx
spec:
  selector: { app: mailhog }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
