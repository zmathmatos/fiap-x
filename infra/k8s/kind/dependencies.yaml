# Backing services for the CD kind smoke test only. Not part of the production
# kustomization (infra/k8s/kustomization.yaml) — real environments point at
# managed Postgres/Redis/RabbitMQ/S3/SMTP instead. Credentials here are
# throwaway: the cluster that uses them is created and destroyed within a
# single CI job.
apiVersion: v1
kind: Namespace
metadata:
  name: fiapx
---
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
  namespace: fiapx
type: Opaque
stringData:
  JWT_SECRET: kind-smoke-test-secret
  DB_USER: fiapx
  DB_PASSWORD: fiapx
  RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672
  STORAGE_ACCESS_KEY: fiapx
  STORAGE_SECRET_KEY: fiapx-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fiapx
  labels: { app: postgres, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: fiapx }
            - { name: POSTGRES_USER, value: fiapx }
            - { name: POSTGRES_PASSWORD, value: fiapx }
          ports:
            - { name: db, containerPort: 5432 }
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'fiapx', '-d', 'fiapx']
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fiapx
spec:
  selector: { app: postgres }
  ports:
    - { name: db, port: 5432, targetPort: db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fiapx
  labels: { app: redis, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - { name: db, containerPort: 6379 }
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fiapx
spec:
  selector: { app: redis }
  ports:
    - { name: db, port: 6379, targetPort: db }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fiapx
  labels: { app: rabbitmq, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: fiapx }
            - { name: RABBITMQ_DEFAULT_PASS, value: fiapx }
          ports:
            - { name: amqp, containerPort: 5672 }
          readinessProbe:
            exec:
              command: ['rabbitmq-diagnostics', '-q', 'check_running']
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fiapx
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fiapx
  labels: { app: minio, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-11-07T00-52-20Z
          command: ['server', '/data', '--console-address', ':9001']
          env:
            - { name: MINIO_ROOT_USER, value: fiapx }
            - { name: MINIO_ROOT_PASSWORD, value: fiapx-secret }
          ports:
            - { name: api, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: api }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fiapx
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: api }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: fiapx
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-11-05T11-29-45Z
          command:
            - /bin/sh
            - -c
            - >-
              mc alias set local http://minio:9000 fiapx fiapx-secret &&
              mc mb --ignore-existing local/fiapx-raw &&
              mc mb --ignore-existing local/fiapx-zips
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: fiapx
  labels: { app: mailhog, tier: dependency }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mailhog }
  template:
    metadata:
      labels: { app: mailhog }
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - { name: smtp, containerPort: 1025 }
          readinessProbe:
            tcpSocket: { port: smtp }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: fiapx
spec:
  selector: { app: mailhog }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
