# Modelo. Não commite valores reais.
#
# Gere o Secret de verdade fora do repositório, por exemplo:
#   kubectl -n fiapx create secret generic fiapx-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DB_USER=fiapx_video \
#     --from-literal=DB_PASSWORD='...' \
#     --from-literal=RABBITMQ_URL='amqp://user:pass@rabbitmq:5672' \
#     --from-literal=STORAGE_ACCESS_KEY='...' \
#     --from-literal=STORAGE_SECRET_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: fiapx-secrets
  namespace: fiapx
type: Opaque
stringData:
  JWT_SECRET: replace-me
  DB_USER: replace-me
  DB_PASSWORD: replace-me
  RABBITMQ_URL: amqp://replace-me@rabbitmq:5672
  STORAGE_ACCESS_KEY: replace-me
  STORAGE_SECRET_KEY: replace-me
